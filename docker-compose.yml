services:
  minio:
    # MinIO withdrew its public minio/minio and quay.io/minio/minio images in 2026;
    # pgsty/silo is the maintained MinIO-compatible fork Lakekeeper's own docs now use.
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - lakehouse

  minio-init:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/warehouse &&
        mc mb --ignore-existing local/bronze &&
        mc mb --ignore-existing local/silver &&
        mc mb --ignore-existing local/gold &&
        mc mb --ignore-existing local/bench
    networks:
      - lakehouse

  lakekeeper-db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5432 -d postgres"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - lakehouse

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:latest-main
    environment:
      - LAKEKEEPER__PG_ENCRYPTION_KEY=This-is-NOT-Secure!
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
    command: ["migrate"]
    restart: "no"
    depends_on:
      lakekeeper-db:
        condition: service_healthy
    networks:
      - lakehouse

  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest-main
    environment:
      - LAKEKEEPER__PG_ENCRYPTION_KEY=This-is-NOT-Secure!
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
    command: ["serve"]
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 5s
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      lakekeeper-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - lakehouse

  lakekeeper-bootstrap:
    image: curlimages/curl:latest
    depends_on:
      lakekeeper:
        condition: service_healthy
    restart: "no"
    command:
      - -s
      - -X
      - POST
      - http://lakekeeper:8181/management/v1/bootstrap
      - -H
      - "Content-Type: application/json"
      - --data
      - '{"accept-terms-of-use": true}'
    networks:
      - lakehouse

  lakekeeper-warehouse:
    image: curlimages/curl:latest
    depends_on:
      lakekeeper-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    command:
      - -s
      - -X
      - POST
      - http://lakekeeper:8181/management/v1/warehouse
      - -H
      - "Content-Type: application/json"
      - --data
      - "@/config/create-warehouse.json"
    volumes:
      - ./create-warehouse.json:/config/create-warehouse.json:ro
    networks:
      - lakehouse

  lakekeeper-warehouse-medallion:
    image: curlimages/curl:latest
    depends_on:
      lakekeeper-warehouse:
        condition: service_completed_successfully
    restart: "no"
    command:
      - -s
      - -c
      - |
        for layer in bronze silver gold bench; do
          curl -s -X POST http://lakekeeper:8181/management/v1/warehouse \
            -H "Content-Type: application/json" \
            --data "@/config/create-warehouse-$${layer}.json"
        done
    entrypoint: /bin/sh
    volumes:
      - ./create-warehouse-bronze.json:/config/create-warehouse-bronze.json:ro
      - ./create-warehouse-silver.json:/config/create-warehouse-silver.json:ro
      - ./create-warehouse-gold.json:/config/create-warehouse-gold.json:ro
      - ./create-warehouse-bench.json:/config/create-warehouse-bench.json:ro
    networks:
      - lakehouse

  trino:
    image: trinodb/trino:latest
    ports:
      - "8080:8080"
    volumes:
      - ./catalog:/etc/trino/catalog:ro
    healthcheck:
      test: ["CMD", "curl", "-I", "http://localhost:8080/v1/status"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 10s
    depends_on:
      lakekeeper:
        condition: service_healthy
    networks:
      - lakehouse

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    depends_on:
      trino:
        condition: service_healthy
    networks:
      - lakehouse

networks:
  lakehouse:

volumes:
  minio_data:
